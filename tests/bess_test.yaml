# ---------------------------------------------------------------------------
# NZ grid-scale BESS registry
#
# Every battery in EMI has TWO dispatch units at its point of connection (POC):
#   gen_unit  - injection unit (discharge, plus reserves offered as generation)
#   load_unit - offtake unit  (charging, plus reserves offered as interruptible load)
# POCs are shared with other plant (Glenbrook Steel, Huntly units, Taiohi solar),
# so matching is always on POC + unit code.
#
# To add a battery: copy a block, fill in POC and both unit codes (the "Probe EMI
# schemas" workflow lists them), commit. The next nightly run back-fills it.
# Batteries tagged BAT in EMI's plant list but missing here are auto-detected
# (discharge and reserves only) and flagged on the dashboard.
#
# Codes below were confirmed from EMI files for trading date 2026-11-03.
# ---------------------------------------------------------------------------

settings:
  start_date: 2026-01-01          # first trading date in the history
  reprocess_days: 4               # re-run the last N days each night (interim -> final prices)
  max_new_days_per_run: 45        # back-fill in chunks so one run stays well under GitHub's 6h limit
  reference_nodes: {NI: OTA2201, SI: BEN2201}
  tight_market:
    price_threshold: 300          # $/MWh island reference price at/above which a TP is "tight"
    headroom_threshold_mw: 400    # or: uncleared energy offered below the cap in the island < this
    headroom_price_cap: 1000
  thermal_prefixes:               # fallback fuel tags if the plant list lacks a fuel for a unit
    HLY: coal/gas
    SFD: gas
    MKE: gas
    JRD: gas
    TRC: gas
    WHI: diesel

