name: Nightly BESS update

on:
  schedule:
    # 13:30 UTC = 02:30 NZDT (01:30 NZST). EMI publishes the previous day's cleared offers and
    # interim prices overnight; the pipeline re-processes the last 4 days so prices settle to final.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Re-process from (YYYY-MM-DD, optional)"
        required: false
      to:
        description: "Re-process to (YYYY-MM-DD, optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build
        run: |
          ARGS=""
          if [ -n "${{ inputs.from }}" ]; then ARGS="$ARGS --from ${{ inputs.from }}"; fi
          if [ -n "${{ inputs.to }}" ]; then ARGS="$ARGS --to ${{ inputs.to }}"; fi
          python -m pipeline.build $ARGS
      - name: Commit updated data
        run: |
          git config user.name "bess-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed docs/data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
