name: Nightly BESS update

on:
  schedule:
    # 13:30 UTC = 02:30 NZDT (01:30 NZST). EMI publishes the previous day's cleared offers and
    # interim prices overnight; the pipeline re-processes the last 4 days so prices settle to final.
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Re-process from (YYYY-MM-DD, optional)"
        required: false
      to:
        description: "Re-process to (YYYY-MM-DD, optional)"
        required: false
      publish_only:
        description: "Only rebuild the dashboard files from saved data (no EMI downloads)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build
        run: |
          ARGS=""
          if [ -n "${{ inputs.from }}" ]; then ARGS="$ARGS --from ${{ inputs.from }}"; fi
          if [ -n "${{ inputs.to }}" ]; then ARGS="$ARGS --to ${{ inputs.to }}"; fi
          if [ "${{ inputs.publish_only }}" = "true" ]; then ARGS="--publish-only"; fi
          python -m pipeline.build $ARGS
      - name: Commit updated data
        # Outputs only: put this run's data on top of the latest main, so code pushed while the
        # job was running can never conflict with the data commit.
        run: |
          git config user.name "bess-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r data/processed /tmp/out/processed && cp -r docs/data /tmp/out/docsdata
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B main origin/main
            rm -rf data/processed docs/data
            mkdir -p data docs
            cp -r /tmp/out/processed data/processed && cp -r /tmp/out/docsdata docs/data
            git add -A data/processed docs/data
            git diff --cached --quiet && { echo "no data changes"; exit 0; }
            git commit -q -m "Data update $(date -u +%Y-%m-%d)"
            git push -q origin main && exit 0
            echo "push raced with another commit - retrying"; sleep 5
          done
          exit 1
