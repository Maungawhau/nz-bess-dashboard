name: Probe EMI schemas

# Run this once by hand (Actions tab -> Probe EMI schemas -> Run workflow).
# It prints the real column names of every EMI file the pipeline uses and the
# rows that mention the battery connection points, so the codes in
# config/bess.yaml can be confirmed.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pipeline.probe
      - run: cat probe_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: probe_report
          path: probe_report.md
